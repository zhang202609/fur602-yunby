name: Update Checker

on:
  workflow_dispatch:
  schedule:
  - cron: 0 18 * * 2,4,6

env:
  # 必须与 FUR-602.yml 中的 REPO_URL / REPO_BRANCH 保持一致，否则检测毫无意义
  REPO_URL: https://github.com/bbb0bbb0bbb/immortalwrt-mt798x-24.10
  REPO_BRANCH: 2410

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
    - name: Get Commit Hash
      id: getHash
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH .
        git log --name-only >> text.txt
        echo "commitHash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Compare Commit Hash
      id: cacheHash
      uses: actions/cache@v4
      with:
        path: .commitHash
        key: HEAD-fur602-${{ steps.getHash.outputs.commitHash }}

    - name: Save New Commit Hash
      if: steps.cacheHash.outputs.cache-hit != 'true'
      run: |
        echo ${{ steps.getHash.outputs.commitHash }} | tee .commitHash

    - name: Email notification
      uses: dawidd6/action-send-mail@master
      if: steps.cacheHash.outputs.cache-hit != 'true' && !cancelled() && secrets.MAILUSERNAME != ''
      with:
        server_address: smtp.163.com
        server_port: 465
        username: ${{ secrets.MAILUSERNAME }}
        password: ${{ secrets.MAILPASSWORD }}
        subject: FUR-602 upstream source updated
        body: file://text.txt
        to: ${{ secrets.MAIL }}
        from: GitHub Actions For Checking Update
        content_type: text/html

    # 想让源码更新后自动触发编译：在仓库 Settings -> Secrets 添加 ACTIONS_TRIGGER_PAT
    # （具备 repo 权限的 PAT），然后取消下面整段的注释。
    # - name: Trigger build
    #   if: steps.cacheHash.outputs.cache-hit != 'true'
    #   uses: peter-evans/repository-dispatch@v3
    #   with:
    #     token: ${{ secrets.ACTIONS_TRIGGER_PAT }}
    #     event-type: Source Code Update

    - name: Delete workflow runs
      uses: FunctionXJB/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 2
